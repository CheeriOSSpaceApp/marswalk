<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Planner test — Eric</title>
  <style>
    body { margin: 0; display: flex; gap: 16px; font: 14px system-ui; background: #111; color: #eee; padding: 12px; }
    canvas { cursor: crosshair; image-rendering: pixelated; width: 800px; height: 800px; }
    pre { background: #222; padding: 8px; width: 320px; white-space: pre-wrap; }
    button { margin: 4px 4px 4px 0; }
  </style>
</head>
<body>
  <canvas id="c" width="1000" height="1000"></canvas>
  <div>
    <b>Click 1 = start, click 2 = goal.</b> Red = forbidden, yellow = caution.<br />
    <label><input id="suit" type="checkbox" /> Suit failure (O₂ ×1.5)</label><br />
    <label><input id="dust" type="checkbox" /> Dust (visibility 0.3)</label><br />
    <label><input id="ring" type="checkbox" /> No-return ring</label>
    <input id="o2" type="range" min="0" max="400" value="120" /> O₂ left: <span id="o2v">120</span> min<br />
    <button id="eva">EVA: habitat → depot → science → habitat</button><br />
    <b>Inject alert</b> (astronaut at 40% of current route):<br />
    <span id="alerts"></span>
    <pre id="out">loading…</pre>
  </div>
  <script type="module">
    import { createPlanner } from './src/plannerClient.js';
    import { loadSite, lonLatToCell } from './src/data.js';

    const SITE = new URLSearchParams(location.search).get('site') || 'mock';
    const cv = document.getElementById('c'), ctx = cv.getContext('2d'), out = document.getElementById('out');
    const planner = createPlanner();
    const [site, _] = await Promise.all([loadSite(SITE), planner.init(SITE)]);
    const { meta } = site, W = meta.width, H = meta.height;

    // background: hillshade + hazard tint
    const img = new Image(); img.src = `/data/${SITE}/hillshade.png`; await img.decode();
    const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
    const b = bg.getContext('2d'); b.drawImage(img, 0, 0, W, H);
    const px = b.getImageData(0, 0, W, H);
    for (let i = 0; i < W * H; i++) {
      const hz = site.layers.hazard[i];
      if (hz === 2) { px.data[4 * i] = 200; px.data[4 * i + 1] *= 0.4; px.data[4 * i + 2] *= 0.4; }
      else if (hz === 1) { px.data[4 * i + 2] *= 0.6; }
    }
    b.putImageData(px, 0, 0);

    const toLonLat = (x, y) => { const [a, s, c, n] = meta.bbox; return [a + (x + 0.5) / W * (c - a), n - (y + 0.5) / H * (n - s)]; };
    const toXY = ([lon, lat]) => { const { row, col } = lonLatToCell(meta, lon, lat); return [col, row]; };

    let cth = null, lastRes = null, lastPts = [];
    function drawRing() {
      if (!document.getElementById('ring').checked || !cth) return;
      const left = +document.getElementById('o2').value;
      const im = ctx.getImageData(0, 0, W, H), d = im.data;
      for (let i = 0; i < W * H; i++) {
        if (cth[i] > left) { d[4 * i] *= 0.35; d[4 * i + 1] *= 0.35; d[4 * i + 2] *= 0.5; } // beyond no-return: darken
      }
      ctx.putImageData(im, 0, 0);
    }
    function drawLine(coords, color, width, dash = []) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.beginPath();
      coords.forEach((p, k) => { const [x, y] = toXY(p); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    function draw(res, pts, old = null, astro = null) {
      lastRes = res; lastPts = pts;
      ctx.drawImage(bg, 0, 0);
      drawRing();
      if (old) drawLine(old.path.geometry.coordinates, 'rgba(0,229,255,0.45)', 2, [6, 6]);
      if (res?.replan) { drawLine(res.path.geometry.coordinates, '#ff9800', 4); }
      if (res?.turnaround_point) { const [x, y] = toXY(res.turnaround_point); ctx.strokeStyle = '#f00'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x - 9, y - 9); ctx.lineTo(x + 9, y + 9); ctx.moveTo(x + 9, y - 9); ctx.lineTo(x - 9, y + 9); ctx.stroke(); ctx.fillStyle = '#f00'; ctx.fillText('TURN BACK', x + 12, y); }
      if (res?.replan) res = null;
      if (res?.path) {
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3; ctx.beginPath();
        res.path.geometry.coordinates.forEach((p, k) => { const [x, y] = toXY(p); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke();
      }
      ctx.fillStyle = '#fff';
      for (const f of site.targets.features) { const [x, y] = toXY(f.geometry.coordinates); ctx.fillRect(x - 5, y - 5, 10, 10); ctx.fillText(f.properties.name, x + 8, y + 4); }
      ctx.fillStyle = '#0f0'; for (const p of pts) { const [x, y] = toXY(p); ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }
      if (astro) { const [x, y] = toXY(astro); ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.fillText('YOU', x - 10, y + 4); }
    }
    const state = () => ({
      ...(document.getElementById('suit').checked ? { o2_x: 1.5 } : {}),
      ...(document.getElementById('dust').checked ? { visibility: 0.3 } : {}),
    });

    let clicks = [], basePlan = null, alertState = {};
    const alertsBox = document.getElementById('alerts');
    for (const a of site.alerts) {
      const btn = document.createElement('button');
      btn.textContent = `${a.type} → ${a.action}`;
      btn.onclick = async () => {
        if (!basePlan) { out.textContent = 'plan a route first'; return; }
        const coords = basePlan.path.geometry.coordinates;
        const current = coords[Math.floor(coords.length * 0.4)];
        const o2_used_min = basePlan.stats.o2_used_pct / 100 * (site.suit.o2_hours?.value ?? 8) * 60 * 0.4;
        const t = performance.now();
        const res = await planner.replan({ current, alert: a, state: alertState, o2_used_min });
        const ms = Math.round(performance.now() - t);
        if (res.error) { out.textContent = 'ERROR ' + JSON.stringify(res, null, 1); return; }
        alertState = res.state;   // alerts stack
        window.__last = { base: basePlan, replan: res, current };
        draw(res, lastPts, basePlan, current);
        out.textContent = JSON.stringify({ round_trip_ms: ms, ...res.replan, state: res.state, ...res.stats }, null, 1);
      };
      alertsBox.appendChild(btn);
    }
    async function run(req) {
      out.textContent = 'planning…';
      const t = performance.now();
      const res = await planner.plan({ ...req, state: state() });
      const roundTrip = Math.round(performance.now() - t);
      draw(res, [req.start, ...(req.stops || []), req.goal]);
      basePlan = res.error ? null : res; alertState = {}; window.__last = { base: basePlan };
      out.textContent = res.error ? 'ERROR ' + JSON.stringify(res, null, 1)
        : JSON.stringify({ round_trip_ms: roundTrip, ...res.timing_ms, ...res.stats }, null, 1);
    }

    cv.onclick = (e) => {
      const r = cv.getBoundingClientRect();
      const p = toLonLat(Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height));
      clicks.push(p);
      if (clicks.length === 1) { draw(null, clicks); out.textContent = 'now click the goal'; }
      else { run({ start: clicks[0], goal: clicks[1] }); clicks = []; }
    };
    const T = Object.fromEntries(site.targets.features.map((f) => [f.properties.id, f.geometry.coordinates]));
    // Generic EVA (works for any site): habitat -> every depot -> every science target -> habitat
    const byKind = (k) => site.targets.features.filter((f) => f.properties.kind === k).map((f) => f.geometry.coordinates);
    document.getElementById('eva').onclick = () => run({ start: site.meta.habitat, stops: [...byKind('depot'), ...byKind('science')], goal: site.meta.habitat });

    const refreshRing = async () => {
      document.getElementById('o2v').textContent = document.getElementById('o2').value;
      if (document.getElementById('ring').checked) ({ costToHome: cth } = await planner.costToHome({ state: state() }));
      draw(lastRes, lastPts);
    };
    for (const id of ['ring', 'suit', 'dust']) document.getElementById(id).addEventListener('change', refreshRing);
    document.getElementById('o2').oninput = refreshRing;

    draw(null, []);
    out.textContent = `site: ${SITE}, ${W}×${H}, cell ${meta.cell_m} m. Click to plan.`;
  </script>
</body>
</html>
